name: Integrate distractor rules v1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-distractor-rules-v1.yml'
      - 'tools/integrate_distractor_rules_v1.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: integrate-distractor-rules-v1
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded migration and verify idempotence
        run: |
          mkdir -p _distractor_verification
          python -m py_compile tools/integrate_distractor_rules_v1.py
          python tools/integrate_distractor_rules_v1.py --root . | tee _distractor_verification/integration.json
          git diff --exit-code -- LAYOUT_MASTER_PROMPT.md references/EIKEN_G2_LAYOUT_REFERENCE.md rules/FAMOUS_EPISODE_POLICY.md rules/NATURAL_JAPANESE_TRANSLATION.md
          git diff --stat > _distractor_verification/changes.txt
      - name: Verify modified-file scope and publish prompt integration
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed={'AGENTS.md','README.md','MASTER_PROMPT.md'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual <= allowed, actual - allowed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md README.md MASTER_PROMPT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Require evidence-backed Eiken distractors and replace unsupported answer-position quotas'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > _distractor_verification/committed_head.txt
          mkdir -p _distractor_verification/repository_snapshot
          cp AGENTS.md README.md MASTER_PROMPT.md LAYOUT_MASTER_PROMPT.md _distractor_verification/repository_snapshot/
          cp -r rules references tools _distractor_verification/repository_snapshot/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distractor-rules-v1-verification
          path: _distractor_verification/
          retention-days: 7
          if-no-files-found: error
